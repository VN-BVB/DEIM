__include__: [
  # '../dataset/custom_detection.yml',
  'car_seg.yml',
  '../runtime_seg.yml',
  '../base/dataloader_dfine.yml',
  '../base/optimizer.yml',
  '../base/dfine_hgnetv2.yml',
]

print_freq: 50
output_dir: ./outputs_Seg/dfine_hgnetv2_n_custom
eval_mask_ratio: 4 #验证集4倍下采样
postprocessor: SegPostProcessor #后处理器
model: DEIM_MG

DEIM_MG:
  yaml_path: D:/YOLO/DEIM/DEIM_20251224/DEIM/configs/cfg/define-n-seg.yaml
  pretrained: D:/YOLO/DEIM/DEIM_20251224/DEIM/weight/hgnetv2/PPHGNetV2_B0_stage1_MG.pth
  
DEIM:
  backbone: HGNetv2
  decoder: DFINESegTransformer
  
optimizer:
  type: AdamW
  params:
    -
      params: '^(?=.*backbone)(?!.*norm|bn).*$'
      lr: 0.0004
    -
      params: '^(?=.*backbone)(?=.*norm|bn).*$'
      lr: 0.0004
      weight_decay: 0.
    -
      params: '^(?=.*(?:encoder|decoder))(?=.*(?:norm|bn|bias)).*$'
      weight_decay: 0.

  lr: 0.0008
  betas: [0.9, 0.999]
  weight_decay: 0.0001

DEIMCriterion:
  weight_dict: {loss_vfl: 1, loss_bbox: 5, loss_giou: 2, loss_fgl: 0.15, loss_ddf: 1.5,loss_mask_ps_ce: 10.0,loss_mask_ps_dice: 5.0}
  losses: ['vfl', 'boxes', 'local','mask_ps']
  alpha: 0.75
  gamma: 2.0
  reg_max: 32
# Increase to search for the optimal ema
epoches: 400 # 148 + 4n

train_dataloader:
  dataset:
    transforms:
      policy:
        name: stop_epoch
        epoch: 300 # epoch in [71, ~) stop `ops`
        ops: ['RandomPhotometricDistort', 'RandomZoomOut', 'RandomIoUCrop']
  collate_fn:
    base_size_repeat: ~    
    stop_epoch: 300
    ema_restart_decay: 0.9999
  total_batch_size: 4
  num_workers: 0
val_dataloader:
  total_batch_size: 4
  num_workers: 0
