__include__: [
  # '../dataset/custom_detection.yml',
  'car_seg.yml',
  '../runtime_seg.yml',
  '../base/dataloader_dfine.yml',
  '../base/optimizer.yml',
  '../base/dfine_hgnetv2.yml',
]

print_freq: 20
output_dir: ./outputs/dfine_hgnetv2_n_custom
eval_mask_ratio: 4 #验证集4倍下采样
postprocessor: SegPostProcessor #后处理器
model: DEIM_MG

DEIM_MG:
  yaml_path: D:/YOLO/DEIM/DEIM_20251224/DEIM/configs/seg/define-n-seg.yml
  pretrained: D:/YOLO/DEIM/DEIM_20251224/DEIM/weight/hgnetv2/PPHGNetV2_B0_stage1_MG.pth
  
DEIM:
  backbone: HGNetv2
  decoder: DFINESegTransformer

HGNetv2:
  name: 'B0'
  return_idx: [2, 3]
  freeze_at: -1
  freeze_norm: False
  use_lab: True


HybridEncoder:
  in_channels: [512, 1024]
  feat_strides: [16, 32]

  # intra
  hidden_dim: 128
  use_encoder_idx: [1]
  dim_feedforward: 512

  # cross
  expansion: 0.34
  depth_mult: 0.5


DFINESegTransformer:
  feat_channels: [128, 128]
  feat_strides: [16, 32]
  hidden_dim: 128
  dim_feedforward: 512
  num_levels: 2
  num_layers: 3
  eval_idx: -1

  num_points: [6, 6]
  num_queries: 300

  num_denoising: 100
  label_noise_ratio: 0.5
  box_noise_scale: 1.0

  # NEW
  reg_max: 32
  reg_scale: 4

  # Auxiliary decoder layers dimension scaling
  # "eg. If num_layers: 6 eval_idx: -4,
  # then layer 3, 4, 5 are auxiliary decoder layers."
  layer_scale: 1  # 2
  cross_attn_method: default # default, discrete
  query_select_method: default # default, agnostic
  
optimizer:
  type: AdamW
  params:
    -
      params: '^(?=.*backbone)(?!.*norm|bn).*$'
      lr: 0.0004
    -
      params: '^(?=.*backbone)(?=.*norm|bn).*$'
      lr: 0.0004
      weight_decay: 0.
    -
      params: '^(?=.*(?:encoder|decoder))(?=.*(?:norm|bn|bias)).*$'
      weight_decay: 0.

  lr: 0.0008
  betas: [0.9, 0.999]
  weight_decay: 0.0001

DEIMCriterion:
  weight_dict: {loss_vfl: 1, loss_bbox: 5, loss_giou: 2, loss_fgl: 0.15, loss_ddf: 1.5,loss_mask_ps_ce: 10.0,loss_mask_ps_dice: 5.0}
  losses: ['vfl', 'boxes', 'local','mask_ps']
  alpha: 0.75
  gamma: 2.0
  reg_max: 32
# Increase to search for the optimal ema
epoches: 160 # 148 + 4n
train_dataloader:
  total_batch_size: 8
  dataset:
    transforms:
      policy:
        epoch: 148
  collate_fn:
    stop_epoch: 148
    ema_restart_decay: 0.9999
    base_size_repeat: ~

val_dataloader:
  total_batch_size: 8
