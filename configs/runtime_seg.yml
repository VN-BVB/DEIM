print_freq: 20
output_dir: './logs'
checkpoint_freq: 50
plot_train_batch_freq: 50

sync_bn: True
find_unused_parameters: True
verbose_type: 'progress' # origin:原始的输出方式 progress:进度条形式

use_amp: False
scaler:
  type: GradScaler
  enabled: True


use_ema: False
ema:
  type: ModelEMA
  decay: 0.9999
  warmups: 1000

cache_imgsz: 1024
ram_cache: True # 加图片到内存中，加快训练速度

yolo_metrice: True # 需要输出YOLO指标的设置为True